<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sunny Sitters</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2226%22 font-size=%2226%22>☀️</text></svg>">

<style>
:root{
  --sun:#FFD700;--sun-dark:#E6B800;--sun-light:#FFF8D6;
  --sky:#4FC3F7;--sky-dark:#0288D1;--sky-light:#E1F5FE;
  --grass:#66BB6A;--grass-light:#E8F5E9;
  --coral:#FF7043;--coral-light:#FBE9E7;
  --lav:#9575CD;--lav-light:#EDE7F6;
  --ink:#2C2C2A;--ink-mid:#5F5E5A;--ink-light:#B4B2A9;
  --surface:#fff;--s2:#FAFAF8;--s3:#F4F3EE;
  --border:rgba(0,0,0,0.08);--shadow:0 6px 16px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Nunito', 'Nunito Sans', sans-serif;
  background:#F4F3EE;color:var(--ink);
  overflow-x:hidden;overflow-y:auto;min-height:100vh;
}
.app-container{
  max-width:500px;margin:0 auto;background:var(--surface);
  min-height:100vh;display:flex;flex-direction:column;
  position:relative;box-shadow:0 0 20px rgba(0,0,0,0.03);
}
.global-header{
  position:sticky;top:0;z-index:100;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;height:60px;
}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{
  background:var(--s3);border:none;padding:8px 14px;border-radius:20px;
  font-size:14px;font-weight:700;color:var(--ink-mid);cursor:pointer;
  display:none;align-items:center;gap:4px;
}
.app-brand{font-weight:900;font-size:20px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.sync-badge{width:10px;height:10px;border-radius:50%;background:var(--ink-light);}
.sync-badge.online{background:var(--grass);}
.sync-badge.loading{background:var(--sun);animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.4;}}

.view-frame {
  display:none;flex:1;padding:20px 16px 100px 16px;
  overflow-y:visible;position:relative;
}
.view-frame.active{display:flex;flex-direction:column;}

h1{font-size:26px;font-weight:900;margin-bottom:8px;letter-spacing:-0.5px;}
h2{font-size:20px;font-weight:800;margin:16px 0 12px 0;}
p{color:var(--ink-mid);line-height:1.5;font-size:15px;margin-bottom:16px;}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
}

/* Beautiful, Welcoming, Fluid Single-Column Input Layouts */
.input-group{
  margin-bottom:20px;
  display:flex;
  flex-direction:column;
  width:100%;
}
.input-label{
  display:block;font-size:14px;font-weight:800;margin-bottom:8px;color:var(--ink-mid);
}
.input-field{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--s2);
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  outline:none;
  transition:all 0.2s ease;
}
.input-field:focus{
  border-color:var(--sky-dark);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--sky-light);
}

.btn{
  width:100%;padding:14px;border-radius:14px;font-family:inherit;font-size:16px;
  font-weight:800;border:none;cursor:pointer;text-align:center;margin-bottom:10px;
}
.btn-primary{background:var(--sun);color:var(--ink);}
.btn-secondary{background:var(--s3);color:var(--ink-mid);}
.btn-danger{background:var(--coral);color:white;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.admin-scroller{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--s2);margin-bottom:12px;}
.row-item{background:var(--surface);padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border);font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.01);}
.badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:800;text-transform:uppercase;margin-left:6px;}

.footer-nav {
  position:fixed;bottom:0;max-width:500px;width:100%;height:65px;
  background:var(--surface);border-top:1px solid var(--border);
  display:none;justify-content:space-around;align-items:center;z-index:90;
}
.nav-item {
  display:flex;flex-direction:column;align-items:center;font-size:11px;
  font-weight:700;color:var(--ink-light);cursor:pointer;
}
.nav-item.active {color:var(--sky-dark);}
</style>
</head>
<body>

<div class="app-container">
  <header class="global-header">
    <div class="header-left">
      <button id="globalBackBtn" class="back-btn" onclick="handleGlobalBack()">&larr; Back</button>
      <div class="app-brand">☀️ Sunny Sitters <div id="syncIndicator" class="sync-badge"></div></div>
    </div>
    <div id="userRoleBadge" style="font-size:12px;font-weight:800;background:var(--s3);color:var(--ink-mid);padding:4px 10px;border-radius:12px;text-transform:uppercase;">Guest</div>
  </header>

  <div id="view-splash" class="view-frame active">
    <div style="text-align:center;padding:20px 0;">
      <h1 style="font-size:36px;margin-bottom:4px;">Sunny Sitters</h1>
      <p>Newton Corner Neighborhood Babysitting Portal</p>
    </div>
    <div class="card">
      <h2>
